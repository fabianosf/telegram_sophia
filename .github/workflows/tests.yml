name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telegram_sophia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telegram_sophia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: telegram_sophia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      SKIP_BOOT_CHECKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Fernet key
        run: echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run Django tests
        working-directory: backend
        run: python manage.py test
      - name: Deploy checks (production env)
        working-directory: backend
        env:
          DEBUG: "False"
          SKIP_BOOT_CHECKS: "1"
          SECRET_KEY: ci-production-secret-key-with-at-least-fifty-characters-long
          ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          CORS_ALLOWED_ORIGINS: https://example.com
        run: python manage.py check --deploy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build