# Nginx do host → TelegramSophia (Docker frontend em 127.0.0.1:8096)
# Instalar:
#   sudo cp deploy/nginx-ecoreport.shop.conf /etc/nginx/sites-available/ecoreport.shop
#   sudo ln -sfn /etc/nginx/sites-available/ecoreport.shop /etc/nginx/sites-enabled/ecoreport.shop
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ecoreport.shop www.ecoreport.shop;
    return 301 https://ecoreport.shop$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ecoreport.shop;

    ssl_certificate /etc/letsencrypt/live/ecoreport.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecoreport.shop/privkey.pem;

    return 301 https://ecoreport.shop$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecoreport.shop;

    ssl_certificate /etc/letsencrypt/live/ecoreport.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecoreport.shop/privkey.pem;

    client_max_body_size 2M;

    access_log /var/log/nginx/telegramsophia_access.log;
    error_log /var/log/nginx/telegramsophia_error.log;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
